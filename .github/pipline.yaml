name: CI-pipline

on:
 push:
  branches: [ main ]   

jobs:
  build:
    runs-on:  ubuntu-lastest

steps:
 - name: checkout code
   uses: actions/checkout@v5

 - name: Set up node.job
   uses: actions/setup-node@v3
   with:
       node-version: 16  

 - name: Install dependencies
   uses: npm Install

 - name: Run tests
   uses: npm test
